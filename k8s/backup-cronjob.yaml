apiVersion: v1
kind: ServiceAccount
metadata:
  name: scylla-backup
  namespace: scylla
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scylla-backup
  namespace: scylla
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scylla-backup
  namespace: scylla
subjects:
- kind: ServiceAccount
  name: scylla-backup
  namespace: scylla
roleRef:
  kind: Role
  name: scylla-backup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scylla-backup
  namespace: scylla
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: scylla-backup
          restartPolicy: Never
          tolerations:
          - key: scylla.scylladb.com/dedicated
            operator: Equal
            value: "true"
            effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: scylla.scylladb.com/node-pool
                    operator: In
                    values: ["scylla"]
          containers:
          - name: backup
            image: alpine:3.20
            env:
            - name: NS
              value: "scylla"
            - name: KEYSPACE
              value: "demo"
            - name: BUCKET
              value: "chaithu-backup-scylla"
            - name: SELECTOR
              value: "scylla/cluster=scylladb"
            - name: AWS_REGION
              value: "us-east-1"
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              apk add --no-cache aws-cli curl >/dev/null
              curl -sLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl
              chmod +x /usr/local/bin/kubectl
              TAG="backup-$(date -u +%Y%m%d-%H%M%S)"
              PREFIX="s3://${BUCKET}/${KEYSPACE}/${TAG}"
              WORK="$(mktemp -d)"
              PODS="$(kubectl -n "${NS}" get pods -l "${SELECTOR}" --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}')"
              echo ">> tag ${TAG}; snapshotting every running node: ${PODS}"
              { echo "keyspace=${KEYSPACE}"; echo "tag=${TAG}"; echo "taken_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } > "${WORK}/manifest.txt"
              for POD in ${PODS}; do
                if ! kubectl -n "${NS}" exec "${POD}" -c scylla -- nodetool snapshot -t "${TAG}" "${KEYSPACE}" >/dev/null 2>&1; then
                  echo ">> [${POD}] not reachable (skipping)"; echo "node=${POD} skipped=true" >> "${WORK}/manifest.txt"; continue
                fi
                kubectl -n "${NS}" exec "${POD}" -c scylla -- sh -c '
                  cd /var/lib/scylla/data || exit 0
                  find '"${KEYSPACE}"' -path "*/snapshots/'"${TAG}"'/*" -type f | while IFS= read -r f; do
                    echo "===F ${f}"; base64 "${f}"; echo "===E"
                  done' > "${WORK}/${POD}.b64"
                NODE_WORK="${WORK}/nw-${POD}"; mkdir -p "${NODE_WORK}"
                file=""
                while IFS= read -r line; do
                  case "${line}" in
                    "===F "*) rel="${line#===F }"; mkdir -p "${NODE_WORK}/$(dirname "${rel}")"; file="${NODE_WORK}/${rel}"; : > "${file}.b64";;
                    "===E")   [ -n "${file}" ] && { base64 -d "${file}.b64" > "${file}"; rm -f "${file}.b64"; file=""; };;
                    *)        [ -n "${file}" ] && printf '%s\n' "${line}" >> "${file}.b64";;
                  esac
                done < "${WORK}/${POD}.b64"
                if [ -d "${NODE_WORK}/${KEYSPACE}" ]; then
                  echo ">> [${POD}] upload -> ${PREFIX}/${POD}.tgz"
                  tar czf - -C "${NODE_WORK}" "${KEYSPACE}" | aws s3 cp - "${PREFIX}/${POD}.tgz"
                  echo "node=${POD}" >> "${WORK}/manifest.txt"
                else
                  echo "node=${POD} empty=true" >> "${WORK}/manifest.txt"
                fi
                kubectl -n "${NS}" exec "${POD}" -c scylla -- nodetool clearsnapshot -t "${TAG}" "${KEYSPACE}" >/dev/null
              done
              cat "${WORK}/manifest.txt" | aws s3 cp - "${PREFIX}/manifest.txt"
              rm -rf "${WORK}"
              echo ">> done: ${PREFIX}/"
              aws s3 ls "${PREFIX}/"