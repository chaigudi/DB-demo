apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-scylla
  namespace: scylla
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-scylla
  namespace: scylla
subjects:
- kind: Group
  name: gha-scylla
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gha-scylla
  apiGroup: rbac.authorization.k8s.io
